[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigallery"
version = "1.9.0"
description = "OmniGallery local media library and creative workspace"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
omnigallery = "omnigallery.__main__:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.dynamic]
dependencies = { file = ["backend/requirements/base.txt"] }

[tool.ruff]
cache-dir = ".local/cache/ruff"
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]
extend-exclude = [".local", "frontend", "test_data", "models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B017", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
