<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾影</title>
    <style>
      #iib-boot, .iib-no-script { position:fixed; inset:0; z-index:9999; display:grid; place-content:center; justify-items:center; gap:12px; padding:24px; background:#f8fafc; color:#253246; font:14px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif; text-align:center; }
      #iib-boot h1 { margin:0; font-size:18px; font-weight:600; }
      #iib-boot p { margin:0; color:#66758b; }
      #iib-boot button { padding:7px 18px; margin-top:8px; border:1px solid #0067c0; border-radius:6px; background:#0067c0; color:white; cursor:pointer; font:inherit; }
      #iib-boot button:focus-visible { outline:2px solid #0067c0; outline-offset:3px; }
      #iib-boot-indicator { width:24px; height:24px; border:2px solid #d6e4f2; border-top-color:#0067c0; border-radius:50%; animation:iib-boot-spin 1s linear infinite; }
      #iib-boot[data-state="error"] #iib-boot-indicator { display:none; }
      @keyframes iib-boot-spin { to { transform:rotate(360deg); } }
      @media(prefers-reduced-motion:reduce) { #iib-boot-indicator { animation:none; } }
      @media(prefers-color-scheme:dark) { #iib-boot, .iib-no-script { background:#151b24; color:#e8edf5; } #iib-boot p { color:#a5b2c5; } }
    </style>
  </head>
  <body>
    <div id="iib-boot" role="status" aria-live="polite">
      <span id="iib-boot-indicator" aria-hidden="true"></span>
      <h1 id="iib-boot-title">正在打开媒体库</h1>
      <p id="iib-boot-description">请稍候</p>
      <button id="iib-boot-retry" type="button" hidden>重新加载</button>
    </div>
    <div id="iib-app"></div>
    <noscript><style>#iib-boot { display:none; }</style><div class="iib-no-script">请启用浏览器的 JavaScript 后重新打开媒体库。</div></noscript>
    <script>
      (() => {
        const screen = document.getElementById('iib-boot')
        const title = document.getElementById('iib-boot-title')
        const description = document.getElementById('iib-boot-description')
        const retry = document.getElementById('iib-boot-retry')
        retry.addEventListener('click', () => window.location.reload())
        const showFailure = () => {
          screen.dataset.state = 'error'
          title.textContent = '媒体库暂时无法打开'
          description.textContent = '页面加载遇到问题，请重新加载。'
          retry.hidden = false
        }
        const onError = (event) => {
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement) showFailure()
        }
        const timer = window.setTimeout(() => {
          if (screen.dataset.state === 'error') return
          title.textContent = '加载时间有些长'
          description.textContent = '可以继续等待，或重新加载页面。'
          retry.hidden = false
        }, 15000)
        window.addEventListener('error', onError, true)
        window.addEventListener('unhandledrejection', showFailure)
        window.addEventListener('iib:mounted', () => {
          window.clearTimeout(timer)
          window.removeEventListener('error', onError, true)
          window.removeEventListener('unhandledrejection', showFailure)
          screen.remove()
        }, { once:true })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
