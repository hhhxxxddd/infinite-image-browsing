name: Desktop release

on:
  push:
    branches: ['releases/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        packager: [nuitka, pyinstaller]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: |
            backend/requirements/*.txt
            pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'
          key: ${{ matrix.packager }}
      - name: Install and build frontend before embedding it
        working-directory: frontend
        run: |
          npm ci
          npm run check
      - name: Install and test backend
        run: |
          python -m pip install -e . -r backend/requirements/dev.txt -r backend/requirements/marengo.txt -r backend/requirements/qwen.txt -r backend/requirements/search-index.txt
          python -m pip check
          python tools/check.py backend
      - name: Package with Nuitka
        if: matrix.packager == 'nuitka'
        run: |
          python -m pip install Nuitka==4.2.1
          python tools/packaging/build_backend.py nuitka --with-models --with-search-index
      - name: Package with PyInstaller
        if: matrix.packager == 'pyinstaller'
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/packaging/build_backend.py pyinstaller --with-models --with-search-index
      - name: Verify packaged API and embedded frontend
        run: python tools/packaging/smoke_backend.py ".local/build/backend/${{ matrix.packager }}/omnigallery_api_server.exe"
      - name: Prepare sidecar and CLI artifact
        run: |
          $version = (Get-Content frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item ".local/build/backend/${{ matrix.packager }}/omnigallery_api_server.exe" "out/release/OmniGallery_CLI-$version-Windows-${{ matrix.packager }}.exe"
      - name: Build desktop app
        working-directory: frontend
        run: npx tauri build -- --locked
      - name: Collect installer
        run: |
          $installers = @(Get-ChildItem -LiteralPath "frontend/src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -eq 0) { throw "Tauri did not produce an NSIS installer" }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination "out/release/$($installer.BaseName)-${{ matrix.packager }}.exe"
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.packager }}
          path: out/release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - run: echo "VERSION=$(jq -r '.version' frontend/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          files: artifacts/*
