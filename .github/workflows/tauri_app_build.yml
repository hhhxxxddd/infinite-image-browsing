name: tauri_app_build

on:
  push:
    branches: ['releases/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        packager: [nuitka, pyinstaller]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vue/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './vue/src-tauri -> target'
          key: ${{ matrix.packager }}
      - name: Install and build frontend before embedding it
        working-directory: vue
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Install and test backend
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-marengo.txt
          python -m pip check
          python -m unittest scripts.iib.test_runtime scripts.iib.test_scan_refresh scripts.iib.parsers.test_comfyui_only scripts.iib.test_marengo_embedding
      - name: Package with Nuitka
        if: matrix.packager == 'nuitka'
        run: |
          python -m pip install Nuitka==4.2.1
          python -m nuitka --mode=onefile --assume-yes-for-downloads --output-dir=out --output-filename=iib_api_server.exe --include-module=imageio.plugins.pyav --include-package=av --include-module=hnswlib --include-package=twelvelabs --include-data-dir=vue/dist=vue/dist app.py
      - name: Package with PyInstaller
        if: matrix.packager == 'pyinstaller'
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --onefile --name iib_api_server --distpath out --additional-hooks-dir=pyinstaller_hooks --hidden-import=imageio.plugins.pyav --collect-all hnswlib --collect-all twelvelabs --add-data "vue/dist:vue/dist" app.py
      - name: Prepare sidecar and CLI artifact
        run: |
          $version = (Get-Content vue/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item out/iib_api_server.exe "out/release/iib_app_cli-$version-Windows-${{ matrix.packager }}.exe"
          Copy-Item out/iib_api_server.exe vue/src-tauri/iib_api_server-x86_64-pc-windows-msvc.exe
      - name: Build desktop app
        working-directory: vue
        run: npx tauri build -- --locked
      - name: Collect installer
        run: |
          Copy-Item "vue/src-tauri/target/release/bundle/nsis/Infinite Image Browsing_$($env:VERSION)_x64-setup.exe" "out/release/Infinite Image Browsing_$($env:VERSION)_x64-setup-${{ matrix.packager }}.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.packager }}
          path: out/release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - run: echo "VERSION=$(jq -r '.version' vue/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          files: artifacts/*
